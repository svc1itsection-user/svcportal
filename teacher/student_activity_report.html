<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Activity Report - SVC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <style>
        body { background: #ffffff; color: #000; padding: 2rem; font-family: 'Segoe UI', sans-serif; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>
<div class="no-print mb-4 d-flex justify-content-between">
    <a href="dashboard.html" class="btn btn-secondary">← Back to Dashboard</a>
    <button onclick="window.print()" class="btn btn-primary">Print Report</button>
</div>
<div id="reportHeader" class="border-bottom pb-3 mb-4">
    <h3 class="fw-bold m-0">ST. VINCENT COLLEGE</h3>
    <h5>Official Student Activity & Grade Report</h5>
    <p class="text-muted m-0" id="reportDate"></p>
</div>
<table class="table table-bordered">
    <thead>
        <tr>
            <th>Student ID</th>
            <th>Subject</th>
            <th>Component</th>
            <th>Result</th>
            <th>SY / Term</th>
        </tr>
    </thead>
    <tbody id="reportTable">
        <tr><td colspan="5" class="text-center py-3">Loading full activity audit trail...</td></tr>
    </tbody>
</table>
<script>
Auth.requireAuth('teacher');
document.getElementById('reportDate').innerText = `Generated on: ${new Date().toLocaleDateString()}`;

async function generateReport() {
    const { data, error } = await _supabase.from('tblrecords').select('*').limit(100);
    const tbody = document.getElementById('reportTable');
    tbody.innerHTML = '';
    if (error || !data) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger">Failed to generate activity report.</td></tr>`;
        return;
    }
    data.forEach(r => {
        tbody.innerHTML += `<tr><td>${r.studentid}</td><td>${r.subjects}</td><td>${r.component}</td><td>${r.result}</td><td>${r.schoolyear} (${r.semester})</td></tr>`;
    });
}
generateReport();
</script>
</body>
</html>
