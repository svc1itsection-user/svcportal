<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVC - Portal Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <style>
        /* 1. Ambient Light Background Canvas with Radial Glows */
        body {
            background-color: #f1f5f9;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(14, 165, 233, 0.22) 0%, transparent 45%),
                radial-gradient(circle at 85% 15%, rgba(16, 185, 129, 0.22) 0%, transparent 45%),
                radial-gradient(circle at 50% 80%, rgba(245, 158, 11, 0.18) 0%, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* 2. Glassmorphism Card Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.85);
            border-radius: 24px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.1);
            width: 100%;
            max-width: 460px;
            padding: 2.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.14);
        }

        .portal-logo { 
            width: 85px; 
            height: 85px; 
            object-fit: contain; 
            filter: drop-shadow(0 4px 12px rgba(14, 165, 233, 0.35)); 
        }

        /* Nav Pills Styling */
        .nav-pills .nav-link {
            color: #64748b;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            padding: 0.65rem 1rem;
        }
        .nav-pills .nav-link.active {
            background: linear-gradient(135deg, #0ea5e9 0%, #10b981 100%);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(14, 165, 233, 0.35);
        }

        /* Form Controls */
        .form-label {
            color: #334155 !important;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .form-control {
            background: rgba(255, 255, 255, 0.8) !important;
            border: 1px solid rgba(203, 213, 225, 0.8) !important;
            color: #0f172a !important;
            font-weight: 600;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            backdrop-filter: blur(10px);
        }
        .form-control:focus { 
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.25); 
            border-color: #0ea5e9 !important; 
        }
        .input-group .form-control {
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
        }
        .input-group .btn-toggle-pass {
            border-top-right-radius: 12px;
            border-bottom-right-radius: 12px;
            border: 1px solid rgba(203, 213, 225, 0.8);
            background: rgba(255, 255, 255, 0.8);
            color: #64748b;
            padding-left: 1rem;
            padding-right: 1rem;
        }
        .input-group .btn-toggle-pass:hover {
            color: #0ea5e9;
        }

        /* Buttons */
        .btn-glass-gradient {
            background: linear-gradient(135deg, #0ea5e9 0%, #10b981 100%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: #ffffff;
            font-weight: 700;
            border-radius: 12px;
            padding: 0.8rem;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 16px rgba(14, 165, 233, 0.3);
            transition: all 0.3s ease;
        }
        .btn-glass-gradient:hover { 
            color: #ffffff; 
            opacity: 0.95; 
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4);
        }

        /* Modal & Spinner */
        .spinner-overlay {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(241, 245, 249, 0.85); 
            backdrop-filter: blur(12px); 
            z-index: 9999; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            flex-direction: column;
        }
        .modal-glass { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9); 
            border-radius: 20px; 
            color: #0f172a; 
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.15); 
        }
    </style>
</head>
<body>

<!-- Animated Loading Indicator -->
<div id="loadingOverlay" class="spinner-overlay" style="display: none;">
    <div class="spinner-border mb-3" style="width: 3.5rem; height: 3.5rem; color: #0ea5e9;" role="status"></div>
    <div class="fw-bold fs-5 text-dark" id="loadingText">VERIFYING CREDENTIALS...</div>
</div>

<!-- Centered Screen Popup Alert Modal -->
<div class="modal fade" id="alertModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-glass p-3 text-center">
            <div class="modal-body fs-5 fw-bold text-dark" id="alertModalBody"></div>
            <div class="mt-3"><button type="button" class="btn btn-glass-gradient px-4" data-bs-dismiss="modal">OK</button></div>
        </div>
    </div>
</div>

<div class="glass-card text-center">
    <img src="logo.png" alt="SVC Logo" class="portal-logo mb-3" onerror="this.style.display='none'">
    <h3 class="fw-bold text-dark mb-1" style="letter-spacing: 0.5px;">ST. VINCENT COLLEGE</h3>
    <p class="small text-secondary fw-bold mb-4" style="letter-spacing: 1px;">PORTAL LOGIN</p>

    <ul class="nav nav-pills nav-justified mb-4" id="loginTabs" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" id="student-tab" data-bs-toggle="tab" data-bs-target="#student-panel">STUDENT</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="teacher-tab" data-bs-toggle="tab" data-bs-target="#teacher-panel">TEACHER</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="admin-tab" data-bs-toggle="tab" data-bs-target="#admin-panel">ADMIN</button>
        </li>
    </ul>

    <div class="tab-content" id="loginTabContent">
        <!-- STUDENT LOGIN PANEL -->
        <div class="tab-pane fade show active" id="student-panel" role="tabpanel">
            <form id="studentLoginForm">
                <div class="mb-3 text-start">
                    <label class="form-label small">STUDENT ID</label>
                    <input type="text" id="studentId" class="form-control" placeholder="E.G. 2025-0001" style="text-transform: uppercase;" required>
                </div>
                <div class="mb-4 text-start">
                    <label class="form-label small">PASSWORD</label>
                    <div class="input-group">
                        <input type="password" id="studentPass" class="form-control" placeholder="••••••••" required>
                        <button class="btn btn-toggle-pass" type="button" onclick="togglePassword('studentPass', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-glass-gradient w-100">SIGN IN AS STUDENT</button>
            </form>
        </div>

        <!-- TEACHER LOGIN PANEL -->
        <div class="tab-pane fade" id="teacher-panel" role="tabpanel">
            <form id="teacherLoginForm">
                <div class="mb-3 text-start">
                    <label class="form-label small">TEACHER ID / USERNAME</label>
                    <input type="text" id="teacherId" class="form-control" placeholder="E.G. T-102" style="text-transform: uppercase;" required>
                </div>
                <div class="mb-4 text-start">
                    <label class="form-label small">PASSWORD</label>
                    <div class="input-group">
                        <input type="password" id="teacherPass" class="form-control" placeholder="••••••••" required>
                        <button class="btn btn-toggle-pass" type="button" onclick="togglePassword('teacherPass', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-glass-gradient w-100">SIGN IN AS TEACHER</button>
            </form>
        </div>

        <!-- ADMIN LOGIN PANEL -->
        <div class="tab-pane fade" id="admin-panel" role="tabpanel">
            <form id="adminLoginForm">
                <div class="mb-3 text-start">
                    <label class="form-label small">ADMIN USERNAME</label>
                    <input type="text" id="adminUser" class="form-control" placeholder="E.G. ADMIN" style="text-transform: uppercase;" required>
                </div>
                <div class="mb-4 text-start">
                    <label class="form-label small">PASSWORD</label>
                    <div class="input-group">
                        <input type="password" id="adminPass" class="form-control" placeholder="••••••••" required>
                        <button class="btn btn-toggle-pass" type="button" onclick="togglePassword('adminPass', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-glass-gradient w-100">SIGN IN AS SUPER ADMIN</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function showAlert(msg) {
    document.getElementById('alertModalBody').innerText = msg;
    new bootstrap.Modal(document.getElementById('alertModal')).show();
}

function showLoading(show, message = "VERIFYING CREDENTIALS...") { 
    document.getElementById('loadingText').innerText = message;
    document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none'; 
}

function autoCapitalizeInputs() {
    document.querySelectorAll('input[type="text"]').forEach(input => {
        input.style.textTransform = 'uppercase';
        input.addEventListener('input', function() {
            this.value = this.value.toUpperCase();
        });
    });
}

function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
    }
}

document.getElementById('studentLoginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    showLoading(true, "LOGGING IN AS STUDENT...");
    const id = document.getElementById('studentId').value.trim();
    const pass = document.getElementById('studentPass').value;

    const { data, error } = await _supabase
        .from('tblstudentuser')
        .select('*')
        .eq('studentid', id)
        .eq('password', pass)
        .maybeSingle();

    showLoading(false);

    if (error || !data) {
        showAlert('INVALID CREDENTIALS. PLEASE CHECK YOUR STUDENT ID AND PASSWORD.');
        return;
    }

    Auth.setUser(data, 'student');
    window.location.href = 'student/dashboard.html';
});

document.getElementById('teacherLoginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    showLoading(true, "LOGGING IN AS TEACHER...");
    const id = document.getElementById('teacherId').value.trim();
    const pass = document.getElementById('teacherPass').value;

    // Preserved exact mixed-case table name
    const { data, error } = await _supabase
        .from('tblTeacherUser')
        .select('*')
        .eq('teacherid', id)
        .eq('password', pass)
        .maybeSingle();

    showLoading(false);

    if (error || !data) {
        showAlert('INVALID CREDENTIALS. PLEASE CHECK YOUR TEACHER ID AND PASSWORD.');
        return;
    }

    Auth.setUser(data, 'teacher');
    window.location.href = 'teacher/dashboard.html';
});

document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    showLoading(true, "LOGGING IN AS SUPER ADMIN...");
    const user = document.getElementById('adminUser').value.trim().toUpperCase();
    const pass = document.getElementById('adminPass').value;

    if (user === 'ADMIN' && pass === ':-)') {
        showLoading(false);
        Auth.setUser({ username: user, role: 'admin' }, 'admin');
        window.location.href = 'admin/dashboard.html';
    } else {
        showLoading(false);
        showAlert('INVALID ADMIN CREDENTIALS.');
    }
});

document.addEventListener("DOMContentLoaded", () => {
    autoCapitalizeInputs();
});
</script>
</body>
</html>
